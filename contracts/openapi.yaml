openapi: 3.1.0
info:
  title: Danber - identidad y pacientes
  version: 0.3.0
  description: >-
    CHG-015. Desarrollo local con registro y búsqueda administrativa de pacientes, sin agenda. Autenticación de mismo origen;
    Host debe coincidir con DANBER_HTTP_ADDR. HTTP de autenticación se rechaza con 426
    salvo DANBER_ALLOW_INSECURE_AUTH=true y peer loopback. Sin CORS ni proxies confiables.
    Sesiones opacas, cookies HttpOnly/SameSite=Strict/Secure con TLS; excepción local sin Secure.
    Valores iniciales de sesión 15m de inactividad y 8h absolutos; revisables.
servers:
  - url: http://127.0.0.1:8090
    description: Local; autenticación HTTP requiere la excepción explícita anterior.
paths:
  /health/live:
    get:
      operationId: liveness
      summary: Comprobar que el proceso responde
      security: []
      responses:
        "200":
          description: El proceso responde, independientemente de SQL.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }
  /health/ready:
    get:
      operationId: readiness
      summary: Comprobar conectividad SQL con plazo de dos segundos
      security: []
      responses:
        "200":
          description: La conexión a la base responde.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ready }
        "503":
          description: Dependencia SQL no disponible; sin detalles internos.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: unavailable }
  /auth/login:
    post:
      operationId: login
      summary: Verificar credenciales y abrir una sesión nueva
      description: >-
        Máximo 4096 bytes, exactamente usuario y contrasena; rechaza campos duplicados/desconocidos.
        Mismo 401 ante usuario ausente, contraseña incorrecta o suspensión. Hasta 10 solicitudes/IP/min,
        60 globales/min y 5/nombre normalizado/min por proceso. Máximo dos verificaciones simultáneas.
        Una cookie previa de la misma cuenta se revoca al autenticar; no se acepta como sesión nueva.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientIntent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usuario, contrasena]
              properties:
                usuario: { type: string, minLength: 1, maxLength: 150 }
                contrasena: { type: string, minLength: 1, maxLength: 128, format: password, writeOnly: true }
      responses:
        '200':
          description: Sesión creada y auditada; bearer solo en Set-Cookie, no en JSON.
          headers:
            Set-Cookie:
              description: danber_session; Path=/; HttpOnly; SameSite=Strict; Secure con TLS; sin Domain.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '426': { $ref: '#/components/responses/HTTPSRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/session:
    get:
      operationId: currentSession
      summary: Consultar sesión y permisos efectivos actuales
      description: >-
        Comprueba cuenta activa, revocación, versión, cambio de contraseña y vencimientos en SQL.
        Actualiza actividad, sin extender vencimiento absoluto. Recarga roles/permisos; no decide
        autorización por recurso. Hasta 120 solicitudes/IP/min y 600 globales/min para sesión/cierres.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Identidad de la sesión, vencimiento absoluto y CSRF; sin datos clínicos ni bearer.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '426': { $ref: '#/components/responses/HTTPSRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revocar la sesión presentada y retirar cookie
      description: >-
        Exige CSRF ligado a la cookie y origen permitido. Repetir un cierre confirmado no duplica
        auditoría. Puede cerrar una sesión vencida; no concede acceso. Límites compartidos con session.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ClientIntent'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Revocación confirmada y cookie retirada; sin cuerpo.
          headers:
            Set-Cookie:
              description: Retira danber_session con Path=/ y Max-Age negativo.
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '426': { $ref: '#/components/responses/HTTPSRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/logout-all:
    post:
      operationId: logoutAllOwnSessions
      summary: Revocar todas las sesiones de la cuenta autenticada
      description: >-
        Requiere sesión vigente y CSRF. Incrementa versión, revoca sesiones y registra auditoría
        en una transacción serializable. También invalida esta cookie. Un login posterior puede
        abrir una sesión con la nueva versión; se controla concurrencia con login.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ClientIntent'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Revocación confirmada y cookie retirada; sin cuerpo.
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '426': { $ref: '#/components/responses/HTTPSRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /pacientes:
    post:
      operationId: registerPatient
      summary: Registrar paciente con documento y apoderado condicional
      description: Requiere pacientes.crear. Alta, apoderado, historial y clave en una transacción. Menor <18 y desde
        66 requieren apoderado. Fecha en America/Lima. Apoderado existente exige coincidencia exacta de nombres/apellidos
        normalizados; no se sobrescribe. Repetición confirmada no reevalúa edad. Un presupuesto compartido del módulo
        de 120/IP/min y 600 global/min, por proceso; 16 KiB y cinco segundos. Permisos recargados por sesión; sin
        datos clínicos.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ClientIntent'
      - $ref: '#/components/parameters/CSRF'
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID canónico en minúsculas distinto de cero. Conservar clave y cuerpo al reintentar. Misma cuenta/clave/cuerpo
          devuelve el mismo 201; cuerpo distinto da 409.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f-]{36}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistration'
      responses:
        '201':
          description: Resultado administrativo autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientCreated'
          headers:
            Location:
              description: Ruta de la ficha, que exige permiso de lectura.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '426':
          $ref: '#/components/responses/HTTPSRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          description: Validación de campos, documento, edad o catálogo; sin reflejar el valor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientValidationError'
        '409':
          description: documento_duplicado, apoderado_datos_difieren o clave_incompatible. No devuelve ID/datos del
            registro en conflicto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pacientes/buscar:
    post:
      operationId: findPatientByDocument
      summary: Buscar por tipo y número exactos
      description: Requiere pacientes.leer para el conjunto administrativo del establecimiento. Documento en cuerpo,
        no en URL. No hay listado ni búsqueda por nombre. Un presupuesto compartido del módulo de 120/IP/min y 600
        global/min, por proceso; 16 KiB y cinco segundos. Permisos recargados por sesión; sin datos clínicos.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ClientIntent'
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientDocument'
      responses:
        '200':
          description: Resultado administrativo autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '426':
          $ref: '#/components/responses/HTTPSRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          description: Validación de campos, documento, edad o catálogo; sin reflejar el valor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientValidationError'
        '404':
          description: Paciente no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pacientes/{id}:
    get:
      operationId: getPatient
      summary: Consultar ficha administrativa por UUID
      description: Requiere pacientes.leer antes de consultar existencia del recurso. Incluye contacto y apoderado
        principal vigente; sin historia clínica. Un presupuesto compartido del módulo de 120/IP/min y 600 global/min,
        por proceso; 16 KiB y cinco segundos. Permisos recargados por sesión; sin datos clínicos.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Resultado administrativo autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '426':
          $ref: '#/components/responses/HTTPSRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          description: Validación de campos, documento, edad o catálogo; sin reflejar el valor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientValidationError'
        '404':
          description: Paciente no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f-]{36}$
  /pacientes/tipos-documento:
    get:
      operationId: patientDocumentTypes
      summary: Consultar tipos de documento activos
      description: Requiere pacientes.leer o pacientes.crear. Solo DNI viene precargado. Catálogo máximo 100 tipos;
        no habilitar otros sin revisar formato y política operativa. Un presupuesto compartido del módulo de 120/IP/min
        y 600 global/min, por proceso; 16 KiB y cinco segundos. Permisos recargados por sesión; sin datos clínicos.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Resultado administrativo autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDocumentTypes'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '426':
          $ref: '#/components/responses/HTTPSRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          description: Validación de campos, documento, edad o catálogo; sin reflejar el valor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientValidationError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: danber_session
      description: Token opaco aleatorio de 256 bits; no se envía como Authorization ni en URL.
  parameters:
    ClientIntent:
      name: X-Danber-Client
      in: header
      required: true
      description: Señal de cliente JSON; no es un secreto ni sustituye sesión/CSRF.
      schema: { type: string, const: '1' }
    CSRF:
      name: X-Danber-CSRF
      in: header
      required: true
      description: csrf_token recibido en login/session para la misma cookie.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
  schemas:
    PatientDocument:
      type: object
      additionalProperties: false
      required:
      - tipo
      - numero
      properties:
        tipo:
          type: string
          maxLength: 30
          description: Código activo; se aplica upper/trim. Solo DNI precargado.
        numero:
          type: string
          minLength: 1
          maxLength: 40
          description: 'Texto con ceros iniciales; DNI exactamente ocho dígitos ASCII. Otros: upper/trim y sin controles;
            formatos específicos pendientes.'
    PatientGuardian:
      type: object
      additionalProperties: false
      required:
      - nombres
      - apellidos
      - documento
      - parentesco
      properties:
        nombres:
          type: string
          minLength: 1
          maxLength: 150
        apellidos:
          type: string
          minLength: 1
          maxLength: 150
        documento:
          $ref: '#/components/schemas/PatientDocument'
        parentesco:
          type: string
          minLength: 1
          maxLength: 80
    PatientRegistration:
      type: object
      additionalProperties: false
      required:
      - nombres
      - apellidos
      - fecha_nacimiento
      - direccion
      - telefono
      - documento
      properties:
        nombres:
          type: string
          minLength: 1
          maxLength: 150
        apellidos:
          type: string
          minLength: 1
          maxLength: 150
        fecha_nacimiento:
          type: string
          format: date
          description: Fecha civil válida y no futura al alta nueva.
        estado_civil:
          type: string
          minLength: 0
          maxLength: 30
        ocupacion:
          type: string
          minLength: 0
          maxLength: 150
        direccion:
          type: string
          minLength: 1
          maxLength: 500
        telefono:
          type: string
          minLength: 1
          maxLength: 30
        correo:
          type: string
          maxLength: 254
          description: Vacío/omitido o dirección de correo simple sin nombre de presentación.
        documento:
          $ref: '#/components/schemas/PatientDocument'
        apoderado:
          anyOf:
          - $ref: '#/components/schemas/PatientGuardian'
          - type: 'null'
    PatientCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          const: 1
    PatientSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - nombres
      - apellidos
      - estado
      - documento
      properties:
        id:
          type: string
          format: uuid
        nombres:
          type: string
          minLength: 1
          maxLength: 150
        apellidos:
          type: string
          minLength: 1
          maxLength: 150
        estado:
          type: string
          enum:
          - activo
          - inactivo
        documento:
          $ref: '#/components/schemas/PatientDocument'
    Patient:
      type: object
      additionalProperties: false
      required:
      - nombres
      - apellidos
      - fecha_nacimiento
      - direccion
      - telefono
      - documento
      - id
      - version
      - estado
      - estado_civil
      - ocupacion
      - correo
      properties:
        nombres:
          type: string
          minLength: 1
          maxLength: 150
        apellidos:
          type: string
          minLength: 1
          maxLength: 150
        fecha_nacimiento:
          type: string
          format: date
          description: Fecha civil válida y no futura al alta nueva.
        estado_civil:
          type: string
          minLength: 0
          maxLength: 30
        ocupacion:
          type: string
          minLength: 0
          maxLength: 150
        direccion:
          type: string
          minLength: 1
          maxLength: 500
        telefono:
          type: string
          minLength: 1
          maxLength: 30
        correo:
          type: string
          maxLength: 254
          description: Vacío/omitido o dirección de correo simple sin nombre de presentación.
        documento:
          $ref: '#/components/schemas/PatientDocument'
        apoderado:
          anyOf:
          - $ref: '#/components/schemas/PatientGuardian'
          - type: 'null'
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        estado:
          type: string
          enum:
          - activo
          - inactivo
    PatientDocumentTypes:
      type: object
      additionalProperties: false
      required:
      - tipos
      properties:
        tipos:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - codigo
            - nombre
            properties:
              codigo:
                type: string
                minLength: 1
                maxLength: 30
              nombre:
                type: string
                minLength: 1
                maxLength: 120
    PatientValidationError:
      type: object
      additionalProperties: false
      required:
      - error
      - campo
      - codigo
      properties:
        error:
          type: string
          const: datos_invalidos
        campo:
          type: string
        codigo:
          type: string
    Principal:
      type: object
      additionalProperties: false
      required: [id, usuario, roles, permisos]
      properties:
        id: { type: string, format: uuid }
        usuario: { type: string }
        roles:
          type: array
          items: { type: string, enum: [maestro, recepcion, odontologo] }
        permisos:
          type: array
          items: { type: string }
    CurrentSession:
      type: object
      additionalProperties: false
      required: [principal, expira_en, csrf_token]
      properties:
        principal: { $ref: '#/components/schemas/Principal' }
        expira_en: { type: string, format: date-time }
        csrf_token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
  responses:
    InvalidRequest:
      description: JSON, claves, tipo de campo o cookies ambiguos; sin reflejar datos recibidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Credenciales o sesión no válidas; sin revelar existencia/estado de cuenta.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permiso denegado, Host/origen, Fetch Metadata, cabecera de cliente o CSRF rechazados.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: "Cuerpo supera el límite: 4096 bytes en acceso, 16384 en pacientes."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMedia:
      description: Login y POST de pacientes requieren application/json.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    HTTPSRequired:
      description: HTTPS requerido; excepción explícita solo para HTTP en loopback.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Presupuesto de solicitudes o verificaciones simultáneas excedido; sin suspender permanentemente.
      headers:
        Retry-After:
          schema: { type: string, pattern: '^[0-9]+$' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: No se pudo confirmar operación; sin error SQL, credenciales ni detalle interno.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
